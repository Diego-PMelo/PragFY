<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PragFY - Dashboard</title>
  <link rel="icon" href="assets/PragFY_Logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="services/theme.js"></script>
</head>
<body>
  <script src="services/storage.js"></script>
  <script>if (!storage.getUser()) window.location.replace('index.html');</script>

  <div id="root"></div>

  <div class="modal fade" id="txModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" id="txModalContent"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="services/api.js"></script>
  <script src="services/utils.js"></script>
  <script src="components/sidebar.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const user = storage.getUser();
    const EMPTY_FORM = (tipo) => ({ valor: '', descricao: '', data: new Date().toISOString().slice(0,10), tipo, idCategoria: '' });

    const PROFILE_META = {
      CONSERVADOR: {
        icon: 'bi-shield-check', color: '#1d9e63',
        tagline: 'Segurança em primeiro lugar',
        allocation: [
          { label: 'Renda Fixa',     pct: 70, color: '#1d9e63' },
          { label: 'Fundos Mistos',  pct: 20, color: '#0891b2' },
          { label: 'Renda Variável', pct: 10, color: '#f59e0b' },
        ],
      },
      MODERADO: {
        icon: 'bi-graph-up', color: '#d97706',
        tagline: 'Crescimento com os pés no chão',
        allocation: [
          { label: 'Renda Fixa',     pct: 50, color: '#1d9e63' },
          { label: 'FIIs',           pct: 20, color: '#d97706' },
          { label: 'Renda Variável', pct: 20, color: '#e05252' },
          { label: 'Internacional',  pct: 10, color: '#8b5cf6' },
        ],
      },
      ARROJADO: {
        icon: 'bi-graph-up-arrow', color: '#e05252',
        tagline: 'Crescimento máximo no longo prazo',
        allocation: [
          { label: 'Renda Variável', pct: 50, color: '#e05252' },
          { label: 'Internacional',  pct: 20, color: '#8b5cf6' },
          { label: 'FIIs',           pct: 15, color: '#d97706' },
          { label: 'Renda Fixa',     pct: 15, color: '#1d9e63' },
        ],
      },
    };

    function InvestorProfileCard({ profile, profileLoading }) {
      if (profileLoading) return null;

      if (!profile) return (
        <div className="card-section mb-4 d-flex align-items-center gap-3 flex-wrap">
          <div style={{ width: 44, height: 44, borderRadius: 12, background: 'var(--color-accent)22', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <i className="bi bi-person-badge" style={{ color: 'var(--color-accent)', fontSize: '1.25rem' }}></i>
          </div>
          <div className="flex-grow-1">
            <div className="fw-semibold">Perfil de investidor não definido</div>
            <div className="text-muted" style={{ fontSize: '0.82rem' }}>
              Responda o questionário e receba recomendações personalizadas de investimento
            </div>
          </div>
          <a href="profile.html" className="btn btn-sm btn-primary-custom">
            <i className="bi bi-clipboard-check me-1"></i>Definir perfil
          </a>
        </div>
      );

      const meta = PROFILE_META[profile.perfilRisco];
      if (!meta) return null;
      const name = profile.perfilRisco.charAt(0) + profile.perfilRisco.slice(1).toLowerCase();

      return (
        <div className="card-section mb-4">
          <div className="d-flex align-items-center gap-3 flex-wrap">
            <div style={{ width: 44, height: 44, borderRadius: 12, background: meta.color + '22', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <i className={`bi ${meta.icon}`} style={{ color: meta.color, fontSize: '1.25rem' }}></i>
            </div>
            <div className="flex-grow-1">
              <div className="d-flex align-items-center gap-2 flex-wrap">
                <span className="fw-semibold" style={{ fontSize: '0.95rem' }}>Perfil de Investidor</span>
                <span className="badge" style={{ background: meta.color + '22', color: meta.color, fontWeight: 600, fontSize: '0.78rem', padding: '3px 10px', borderRadius: 20 }}>
                  {name}
                </span>
              </div>
              <div className="text-muted" style={{ fontSize: '0.82rem' }}>{meta.tagline}</div>
            </div>
            <a href="profile.html" className="btn btn-sm btn-outline-secondary">
              Ver perfil completo <i className="bi bi-arrow-right ms-1"></i>
            </a>
          </div>

          <div className="mt-3">
            <div style={{ height: 8, borderRadius: 4, overflow: 'hidden', display: 'flex' }}>
              {meta.allocation.map(a => (
                <div key={a.label} style={{ width: `${a.pct}%`, background: a.color, transition: 'width 0.4s' }}
                  title={`${a.label}: ${a.pct}%`} />
              ))}
            </div>
            <div className="d-flex flex-wrap gap-3 mt-2">
              {meta.allocation.map(a => (
                <div key={a.label} className="d-flex align-items-center gap-1" style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                  <span style={{ width: 8, height: 8, borderRadius: '50%', background: a.color, display: 'inline-block', flexShrink: 0 }}></span>
                  {a.label}&nbsp;<span style={{ color: a.color, fontWeight: 600 }}>{a.pct}%</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function Dashboard() {
      const now   = new Date();
      const [month,        setMonth]        = useState(now.getMonth() + 1);
      const [year,         setYear]         = useState(now.getFullYear());
      const [summary,      setSummary]      = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [categories,   setCategories]   = useState([]);
      const [loading,      setLoading]      = useState(true);
      const [filterType,   setFilterType]   = useState('ALL');
      const [filterCats,   setFilterCats]   = useState([]);
      const [form,         setForm]         = useState(EMPTY_FORM('EXPENSE'));
      const [saving,       setSaving]       = useState(false);
      const [formError,    setFormError]    = useState('');
      const [newCat,         setNewCat]         = useState(null);
      const [savingCat,      setSavingCat]      = useState(false);
      const [profile,        setProfile]        = useState(null);
      const [profileLoading, setProfileLoading] = useState(true);
      const modalRef = useRef(null);

      const CAT_COLORS = ['#0426b0','#1a9e5c','#e55353','#f59e0b','#8b5cf6','#0891b2','#db2777','#65a30d'];
      const CAT_ICONS  = [
        'bi-house','bi-cart','bi-car-front','bi-heart-pulse','bi-book','bi-controller',
        'bi-phone','bi-lightning','bi-briefcase','bi-graph-up','bi-gift','bi-three-dots',
      ];

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const [s, t, c] = await Promise.all([
            api.get(`/transactions/summary?idUsuario=${user.id}&mes=${month}&ano=${year}`),
            api.get(`/transactions?idUsuario=${user.id}&mes=${month}&ano=${year}`),
            api.get(`/categories?idUsuario=${user.id}`)
          ]);
          setSummary(s);
          setTransactions(t);
          setCategories(c);
        } catch {
          setSummary(null);
          setTransactions([]);
          setCategories([]);
        } finally {
          setLoading(false);
        }
      }, [month, year]);

      useEffect(() => { load(); }, [load]);

      useEffect(() => {
        setProfileLoading(true);
        api.get(`/profile?idUsuario=${user.id}`)
          .then(p => setProfile(p))
          .catch(() => setProfile(null))
          .finally(() => setProfileLoading(false));
      }, []);

      function prevMonth() { if (month === 1) { setMonth(12); setYear(y => y - 1); } else setMonth(m => m - 1); }
      function nextMonth() { if (month === 12) { setMonth(1); setYear(y => y + 1); } else setMonth(m => m + 1); }

      const filtered = useMemo(() => {
        return transactions.filter(t => {
          const typeOk = filterType === 'ALL' || t.tipo === filterType;
          const catOk  = filterCats.length === 0 || filterCats.includes(String(t.idCategoria));
          return typeOk && catOk;
        });
      }, [transactions, filterType, filterCats]);

      const availableCats = useMemo(() => {
        if (filterType === 'ALL') return categories;
        return categories.filter(c => c.tipo === filterType);
      }, [categories, filterType]);

      function handleTypeFilter(type) {
        setFilterType(type);
        setFilterCats([]);
      }

      function toggleCat(id) {
        const sid = String(id);
        setFilterCats(prev =>
          prev.includes(sid) ? prev.filter(c => c !== sid) : [...prev, sid]
        );
      }

      function openModal(tipo) {
        setForm(EMPTY_FORM(tipo));
        setFormError('');
        modalRef.current = new window.bootstrap.Modal(document.getElementById('txModal'));
        modalRef.current.show();
      }

      async function handleSave(e) {
        e.preventDefault();
        setFormError(''); setSaving(true);
        try {
          await api.post('/transactions', {
            idUsuario: user.id,
            valor: Number(form.valor),
            descricao: form.descricao,
            data: form.data,
            tipo: form.tipo,
            idCategoria: form.idCategoria || null,
          });
          modalRef.current.hide();
          load();
        } catch (err) {
          setFormError(err.message || 'Erro ao salvar');
        } finally { setSaving(false); }
      }

      const modalCats = useMemo(() => categories.filter(c => c.tipo === form.tipo), [categories, form.tipo]);

      function startNewCat() {
        setNewCat({ nome: '', cor: '#0426b0', icone: 'bi-three-dots' });
      }

      async function handleSaveCat(e) {
        e.preventDefault();
        setSavingCat(true);
        try {
          const created = await api.post('/categories', {
            idUsuario: user.id,
            nome: newCat.nome,
            tipo: form.tipo,
            cor: newCat.cor,
            icone: newCat.icone,
          });
          setCategories(prev => [...prev, created]);
          setForm(f => ({ ...f, idCategoria: String(created.id) }));
          setNewCat(null);
        } catch (err) {
          setFormError(err.message || 'Erro ao criar categoria');
        } finally { setSavingCat(false); }
      }

      return (
        <div className="app-layout">
          <Sidebar active="dashboard.html" />

          <main className="main-content fade-in">
            <div className="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <h1 className="page-title">Dashboard</h1>
                <p className="page-subtitle">Visão geral das suas finanças</p>
              </div>
              <div className="month-picker">
                <button onClick={prevMonth}><i className="bi bi-chevron-left"></i></button>
                <span>{utils.MONTHS[month - 1]} {year}</span>
                <button onClick={nextMonth}><i className="bi bi-chevron-right"></i></button>
              </div>
            </div>

            {loading ? (
              <div className="text-center py-5">
                <div className="spinner-border" style={{ color: 'var(--color-accent)' }}></div>
              </div>
            ) : (
              <>
                <div className="row g-3 mb-4">
                  {[
                    { cls: 'income',  label: 'Receitas', value: summary?.totalReceita,  icon: 'bi-arrow-up-circle-fill',   type: 'INCOME'  },
                    { cls: 'expense', label: 'Despesas', value: summary?.totalDespesa, icon: 'bi-arrow-down-circle-fill', type: 'EXPENSE' },
                    { cls: 'balance', label: 'Saldo',    value: summary?.saldo,        icon: 'bi-wallet2',                type: null      },
                  ].map(card => (
                    <div key={card.cls} className="col-md-4">
                      <div
                        className={`summary-card ${card.cls} d-flex justify-content-between align-items-center${card.type ? ' summary-card-clickable' : ''}`}
                        onClick={card.type ? () => openModal(card.type) : undefined}
                        title={card.type ? `Adicionar ${card.label.slice(0,-1).toLowerCase()}` : undefined}
                      >
                        <div>
                          <div className="label">{card.label}</div>
                          <div className="amount">{utils.formatBRL(card.value)}</div>
                        </div>
                        <div className="d-flex flex-column align-items-center gap-1">
                          <i className={`bi ${card.icon}`}></i>
                          {card.type && <span style={{ fontSize: '0.65rem', opacity: 0.75, letterSpacing: '0.04em' }}>+ ADICIONAR</span>}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <InvestorProfileCard profile={profile} profileLoading={profileLoading} />

                <div className="card-section">
                  <div className="mb-3">
                    <div className="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                      <h2 className="section-title mb-0">Transações</h2>
                      <div className="d-flex gap-1">
                        {[
                          { v: 'ALL',     l: 'Todas'    },
                          { v: 'INCOME',  l: 'Receitas' },
                          { v: 'EXPENSE', l: 'Despesas' },
                        ].map(f => (
                          <button key={f.v}
                            className={`btn btn-sm ${filterType === f.v ? 'btn-primary-custom' : 'btn-outline-secondary'}`}
                            onClick={() => handleTypeFilter(f.v)}>
                            {f.l}
                          </button>
                        ))}
                      </div>
                    </div>

                    {availableCats.length > 0 && (
                      <div className="d-flex flex-wrap gap-2 align-items-center">
                        <span className="text-muted" style={{ fontSize: '0.8rem' }}>Categorias:</span>
                        {availableCats.map(c => {
                          const active = filterCats.includes(String(c.id));
                          return (
                            <button key={c.id}
                              onClick={() => toggleCat(c.id)}
                              className="cat-chip"
                              style={{
                                '--chip-color': c.cor || 'var(--color-accent)',
                                fontWeight: active ? 700 : 400,
                                background: active ? (c.cor || 'var(--color-accent)') : 'transparent',
                                color: active ? '#fff' : 'var(--text-secondary)',
                                borderColor: c.cor || 'var(--color-accent)',
                              }}>
                              <i className={`bi ${c.icone || 'bi-tag'}`}></i>
                              {c.nome}
                              {active && <i className="bi bi-x-lg ms-1" style={{ fontSize: '0.65rem' }}></i>}
                            </button>
                          );
                        })}
                        {filterCats.length > 0 && (
                          <button className="btn btn-sm btn-link p-0 text-muted" onClick={() => setFilterCats([])}>
                            Limpar
                          </button>
                        )}
                      </div>
                    )}
                  </div>

                  {filtered.length === 0 ? (
                    <div className="text-center py-4 text-muted">
                      <i className="bi bi-inbox fs-2 d-block mb-2"></i>
                      Nenhuma transação encontrada
                    </div>
                  ) : (
                    <div className="table-responsive">
                      <table className="table table-hover align-middle mb-0">
                        <thead className="table-light">
                          <tr>
                            <th>Tipo</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th className="text-end">Valor</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filtered.map(t => (
                            <tr key={t.id}>
                              <td>
                                <span className={`badge rounded-pill ${t.tipo === 'INCOME' ? 'badge-income' : 'badge-expense'}`}>
                                  {t.tipo === 'INCOME' ? 'Receita' : 'Despesa'}
                                </span>
                              </td>
                              <td>{t.descricao || '—'}</td>
                              <td>{t.nomeCategoria || '—'}</td>
                              <td>{new Date(t.data + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                              <td className={`text-end fw-semibold ${t.tipo === 'INCOME' ? 'text-success' : 'text-danger'}`}>
                                {t.tipo === 'INCOME' ? '+' : '-'} {utils.formatBRL(t.valor)}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </>
            )}

            {ReactDOM.createPortal(
              <div>
                <div className="modal-header modal-header-custom">
                  <h5 className="modal-title">
                    {form.tipo === 'INCOME' ? 'Nova receita' : 'Nova despesa'}
                  </h5>
                  <button type="button" className="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form onSubmit={handleSave}>
                  <div className="modal-body">
                    {formError && <div className="alert alert-danger py-2">{formError}</div>}

                    <div className="mb-3">
                      <label className="form-label fw-semibold">Valor (R$)</label>
                      <input className="form-control" type="number" step="0.01" min="0.01" required
                        value={form.valor} onChange={e => setForm(f => ({ ...f, valor: e.target.value }))} />
                    </div>

                    <div className="mb-3">
                      <label className="form-label fw-semibold">Descrição</label>
                      <input className="form-control" type="text" maxLength={255}
                        value={form.descricao} onChange={e => setForm(f => ({ ...f, descricao: e.target.value }))} />
                    </div>

                    <div className="mb-3">
                      <label className="form-label fw-semibold">Data</label>
                      <input className="form-control" type="date" required
                        value={form.data} onChange={e => setForm(f => ({ ...f, data: e.target.value }))} />
                    </div>

                    <div className="mb-3">
                      <div className="d-flex justify-content-between align-items-center mb-1">
                        <label className="form-label fw-semibold mb-0">Categoria</label>
                        {!newCat && (
                          <button type="button" className="btn btn-sm btn-link p-0"
                            style={{ fontSize: '0.8rem' }} onClick={startNewCat}>
                            <i className="bi bi-plus-circle me-1"></i>Nova categoria
                          </button>
                        )}
                      </div>

                      {!newCat ? (
                        <select className="form-select"
                          value={form.idCategoria} onChange={e => setForm(f => ({ ...f, idCategoria: e.target.value }))}>
                          <option value="">Sem categoria</option>
                          {modalCats.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                        </select>
                      ) : (
                        <div className="inline-cat-form">
                          <div className="d-flex justify-content-between align-items-center mb-2">
                            <span className="fw-semibold" style={{ fontSize: '0.85rem' }}>Nova categoria</span>
                            <button type="button" className="btn btn-sm btn-link p-0 text-muted"
                              onClick={() => setNewCat(null)}>
                              <i className="bi bi-x-lg"></i>
                            </button>
                          </div>

                          <input className="form-control form-control-sm mb-2" type="text"
                            placeholder="Nome da categoria" maxLength={80} required
                            value={newCat.nome} onChange={e => setNewCat(n => ({ ...n, nome: e.target.value }))} />

                          <div className="mb-2">
                            <div className="d-flex gap-1 flex-wrap mb-1">
                              {CAT_COLORS.map(cor => (
                                <button key={cor} type="button"
                                  onClick={() => setNewCat(n => ({ ...n, cor }))}
                                  style={{
                                    width: 24, height: 24, background: cor, border: 'none',
                                    borderRadius: '50%', cursor: 'pointer',
                                    outline: newCat.cor === cor ? `3px solid ${cor}` : 'none',
                                    outlineOffset: 2,
                                  }} />
                              ))}
                            </div>
                            <div className="d-flex gap-1 flex-wrap">
                              {CAT_ICONS.map(icone => (
                                <button key={icone} type="button"
                                  onClick={() => setNewCat(n => ({ ...n, icone }))}
                                  className={`btn btn-sm p-1 ${newCat.icone === icone ? 'btn-primary-custom' : 'btn-outline-secondary'}`}
                                  style={{ width: 32, height: 32, lineHeight: 1 }}>
                                  <i className={`bi ${icone}`} style={{ fontSize: '0.85rem' }}></i>
                                </button>
                              ))}
                            </div>
                          </div>

                          <div className="d-flex align-items-center justify-content-between gap-2">
                            <div className="d-flex align-items-center gap-2">
                              <div style={{
                                width: 28, height: 28, borderRadius: '50%',
                                background: newCat.cor, display: 'flex',
                                alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                              }}>
                                <i className={`bi ${newCat.icone} text-white`} style={{ fontSize: '0.75rem' }}></i>
                              </div>
                              <span style={{ fontSize: '0.82rem', color: 'var(--text-secondary)' }}>
                                {newCat.nome || 'Prévia'}
                              </span>
                            </div>
                            <button type="button" className="btn btn-sm btn-primary-custom"
                              disabled={savingCat || !newCat.nome.trim()} onClick={handleSaveCat}>
                              {savingCat
                                ? <span className="spinner-border spinner-border-sm"></span>
                                : <><i className="bi bi-check2 me-1"></i>Criar</>}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" className="btn btn-primary-custom" disabled={saving}>
                      {saving ? <span className="spinner-border spinner-border-sm"></span> : 'Salvar'}
                    </button>
                  </div>
                </form>
              </div>,
              document.getElementById('txModalContent')
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
