            detail: 'O Tesouro Selic é um título público federal emitido pelo governo brasileiro, considerado o investimento mais seguro do país. Sua rentabilidade acompanha a taxa Selic — a taxa básica de juros da economia — o que garante rendimento positivo mesmo em cenários de oscilação do mercado.\n\nPor ter liquidez diária, você pode resgatar o valor investido a qualquer momento sem perda de rentabilidade, o que o torna ideal para a reserva de emergência. Para o perfil Conservador, ele representa a base da carteira: previsível, seguro e acessível.',

            method: 'Para o perfil Arrojado, priorize FIIs de desenvolvimento (que compram e vendem imóveis) e FIIs de papel com exposição a CRIs de alta rentabilidade. Analise o Dividend Yield real (descontando eventos não-recorrentes como venda de imóveis). Verifique a qualidade dos inquilinos e o prazo médio dos contratos nos relatórios mensais. Compare o P/VP: abaixo de 0,95 pode indicar desconto em relação ao valor dos ativos. Acompanhe o pipeline de novos projetos — fundos em expansão tendem a diluir o valor por cota no curto prazo.' },
          { icon: 'bi-currency-bitcoin', name: 'Criptoativos', desc: 'Alta volatilidade — mantenha abaixo de 5%', tag: 'Opcional',
            detail: 'Criptoativos como Bitcoin e Ethereum são ativos digitais descentralizados com altíssima volatilidade — podem subir ou cair 50% em poucos meses. Por isso, mesmo para perfis arrojados, a recomendação é limitar a exposição a no máximo 5% do patrimônio total.\n\nEssa parcela funciona como um "bônus" de risco: se valorizar muito, impacta positivamente o portfólio; se desvalorizar, o impacto é controlado. Prefira exchanges regulamentadas no Brasil ou ETFs de cripto disponíveis na B3. Nunca invista em cripto valores que comprometam seus objetivos principais.',
            method: 'Foque em ativos com maior liquidez e histórico: Bitcoin (BTC) e Ethereum (ETH) respondem por mais de 60% do mercado e têm maior previsibilidade relativa. Prefira ETFs de cripto disponíveis na B3 (como BITH11 ou ETHE11) a comprar diretamente em exchanges, pela segurança regulatória. Se optar por exchanges, use apenas plataformas regulamentadas pela CVM. Verifique o volume diário de negociação e o tempo de existência do ativo antes de investir em altcoins. Nunca invista em projetos sem whitepaper claro, equipe identificada ou auditoria de código independente.' },
        ],
        steps: [
          { label: 'Mantenha a reserva de emergência separada', desc: 'Mantenha uma reserva de emergência separada da carteira de investimentos (mínimo 3 meses)',
            detail: 'Mesmo sendo arrojado, você não deve misturar sua reserva de emergência com a carteira de investimentos. Se precisar de dinheiro urgente e seu portfólio estiver em queda, você seria obrigado a vender ativos no pior momento.\n\nMínimo de 3 meses de gastos em Tesouro Selic ou CDB com liquidez diária é suficiente para o perfil Arrojado. Considere essa reserva como intocável e invisível — ela não faz parte da carteira, é apenas uma proteção para que você nunca precise tomar decisões financeiras por desespero.' },
          { label: 'Estude análise fundamentalista', desc: 'Estude análise fundamentalista antes de selecionar ações individuais',
            detail: 'Análise fundamentalista é o método de avaliar uma empresa através de seus dados financeiros: receita, lucro, dívida, margens, crescimento e múltiplos de valuation como P/L (Preço/Lucro) e P/VP (Preço/Valor Patrimonial).\n\nAntes de comprar ações de uma empresa, leia os relatórios trimestrais, entenda o modelo de negócio e compare com concorrentes. Plataformas como o Status Invest, Fundamentus e os próprios Relatórios de Administração das empresas na B3 são pontos de partida excelentes. Sem esse estudo, você não investe — especula.' },
          { label: 'Use aportes mensais regulares', desc: 'Use dollar-cost averaging — aporte mensalmente independente do preço',
            detail: 'Dollar-cost averaging (DCA) é a estratégia de aportar um valor fixo todo mês, independentemente se o mercado está em alta ou em baixa. Quando os preços caem, você compra mais cotas pelo mesmo dinheiro; quando sobem, compra menos — resultando em um custo médio reduzido ao longo do tempo.\n\nPara o perfil Arrojado, essa disciplina é ainda mais importante, pois a tentação de "esperar o momento certo" para comprar ou vender é enorme. Estudos mostram que investidores que tentam fazer market timing consistentemente têm desempenho inferior a quem simplesmente aporta todo mês.' },
          { label: 'Diversifique setores e geografias', desc: 'Diversifique entre setores e geografias para reduzir risco não-sistêmico',
            detail: 'Concentrar a carteira em um único setor ou país é o erro mais comum de investidores arrojados. Se você tiver 80% em ações de bancos e o setor bancário passar por uma crise, seu portfólio sofre de forma desproporcional.\n\nA diversificação não elimina o risco de mercado (nenhum investimento é imune a crises globais), mas reduz o risco não-sistêmico — o risco específico de um setor ou empresa. Distribua entre setores como tecnologia, energia, saúde, consumo e financeiro, e entre diferentes países para proteger a carteira de eventos locais.' },
        ],
      },
    };

    function DetailModal({ item, color, onClose }) {
      if (!item) return null;
      const paragraphs = item.detail ? item.detail.split('\n\n') : [];
      return (
        <div className="detail-modal-backdrop" onClick={onClose}>
          <div className="detail-modal-box fade-in" onClick={e => e.stopPropagation()}>
            <div className="detail-modal-header" style={{ background: color }}>
              {item.icon && <i className={`bi ${item.icon} detail-modal-hicon`}></i>}
              <div className="flex-grow-1">
                <div className="detail-modal-title">{item.name || item.label}</div>
                {item.desc && <div className="detail-modal-sub">{item.desc}</div>}
              </div>
              <button className="detail-modal-close" onClick={onClose}>
                <i className="bi bi-x-lg"></i>
              </button>
            </div>
            <div className="detail-modal-body">
              {paragraphs.map((p, i) => <p key={i}>{p}</p>)}

              {item.method && (
                <div className="detail-method-section">
                  <div className="detail-method-title" style={{ color }}>
                    <i className="bi bi-search me-2"></i>
                    Como identificar um bom produto
                  </div>
                  <p>{item.method}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function AllocationChecklist({ allocation, riskProfile }) {
      const storageKey = `pragfy_alloc_${user.id}_${riskProfile}`;
      const [checked, setChecked] = useState(() => {
        try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); }
        catch { return {}; }
      });

      function toggle(label) {
        setChecked(prev => {
          const next = { ...prev, [label]: !prev[label] };
          localStorage.setItem(storageKey, JSON.stringify(next));
          return next;
        });
      }

      const done = allocation.filter(a => checked[a.label]).length;

      return (
        <div>
          <div className="alloc-bar mb-3">
            {allocation.map(a => (
              <div key={a.label} style={{ width: `${a.pct}%`, background: a.color, opacity: checked[a.label] ? 1 : 0.35, transition: 'opacity 0.3s' }}
                title={`${a.label}: ${a.pct}%`} />
            ))}
          </div>

          <div className="d-flex flex-column gap-2">
            {allocation.map(a => (
              <label key={a.label} className={`alloc-check-row ${checked[a.label] ? 'alloc-check-row--done' : ''}`}
                onClick={() => toggle(a.label)}>
                <span className="alloc-dot" style={{ background: a.color }} />
                <span className="alloc-label">{a.label}</span>
                <span className="alloc-pct">{a.pct}%</span>
                <span className={`alloc-checkbox ${checked[a.label] ? 'alloc-checkbox--checked' : ''}`}
                  style={{ '--chk-color': a.color }}>
                  {checked[a.label] && <i className="bi bi-check-lg"></i>}
                </span>
              </label>
            ))}
          </div>

          <div className="alloc-progress-label">
            {done} de {allocation.length} alocações concluídas
          </div>
        </div>
      );
    }

    function ProfileResult({ saved, onRedo }) {
      const [selected, setSelected] = useState(null);
      const data = PROFILE_DATA[saved.riskProfile];
      if (!data) return null;

      const tagColors = { Essencial: '#1d9e63', Recomendado: '#0426b0', Complementar: '#d97706', Opcional: '#8b5cf6' };

      return (
        <div className="fade-in">
          {selected && (
            <DetailModal item={selected} color={data.color} onClose={() => setSelected(null)} />
          )}

          {/* Hero card */}
          <div className={`profile-hero profile-hero--${data.cls} mb-4`}>
            <div className="d-flex align-items-center gap-3 mb-3">
              <div className="profile-hero-icon">
                <i className={`bi ${data.icon}`}></i>
              </div>
              <div>
                <div className="profile-hero-label">Seu perfil de investidor</div>
                <div className="profile-hero-name">{saved.riskProfile.charAt(0) + saved.riskProfile.slice(1).toLowerCase()}</div>
                <div className="profile-hero-tagline">{data.tagline}</div>
              </div>
            </div>
            <p className="profile-hero-desc">{data.desc}</p>
            <button className="btn btn-sm btn-outline-light mt-1" onClick={onRedo}>
              <i className="bi bi-arrow-repeat me-1"></i>Refazer questionário
            </button>
          </div>

          <div className="row g-4">
            {/* Alocação sugerida */}
            <div className="col-lg-6">
              <div className="card-section h-100">
                <h2 className="section-title">
                  <i className="bi bi-pie-chart me-2" style={{ color: data.color }}></i>
                  Alocação sugerida
                </h2>
                <AllocationChecklist allocation={data.allocation} riskProfile={saved.riskProfile} />
              </div>
            </div>

            {/* Produtos recomendados */}
            <div className="col-lg-6">
              <div className="card-section h-100">
                <h2 className="section-title">
                  <i className="bi bi-star me-2" style={{ color: data.color }}></i>
                  Produtos recomendados
                  <span className="ms-2" style={{ fontSize: '0.72rem', fontWeight: 400, color: 'var(--text-muted)' }}>
                    clique para saber mais
                  </span>
                </h2>
                <div className="d-flex flex-column gap-2">
                  {data.products.map(p => (
                    <div key={p.name} className="product-row product-row--clickable" onClick={() => setSelected(p)}>
                      <div className="product-icon" style={{ background: data.color + '22', color: data.color }}>
                        <i className={`bi ${p.icon}`}></i>
                      </div>
                      <div className="flex-grow-1 overflow-hidden">
                        <div className="d-flex align-items-center gap-2">
                          <span className="product-name">{p.name}</span>
                          <span className="product-tag" style={{ background: tagColors[p.tag] + '22', color: tagColors[p.tag] }}>
                            {p.tag}
                          </span>
                        </div>
                        <div className="product-desc">{p.desc}</div>
                      </div>
                      <i className="bi bi-chevron-right product-chevron"></i>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Primeiros passos */}
            <div className="col-12">
              <div className="card-section">
                <h2 className="section-title">
                  <i className="bi bi-list-check me-2" style={{ color: data.color }}></i>
                  Primeiros passos
                  <span className="ms-2" style={{ fontSize: '0.72rem', fontWeight: 400, color: 'var(--text-muted)' }}>
                    clique para saber mais
                  </span>
                </h2>
                <div className="d-flex flex-column gap-2">
                  {data.steps.map((step, i) => (
                    <div key={i} className="step-row step-row--clickable" onClick={() => setSelected(step)}>
                      <div className="step-num" style={{ background: data.color }}>{i + 1}</div>
                      <p className="step-text">{step.desc}</p>
                      <i className="bi bi-chevron-right product-chevron ms-2"></i>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Questionnaire({ onDone }) {
      const [step,    setStep]    = useState(0);
      const [answers, setAnswers] = useState({});
      const [saving,  setSaving]  = useState(false);
      const [dir,     setDir]     = useState('forward');

      const q = QUESTIONS[step];
      const total = QUESTIONS.length;
      const progress = Math.round(((step) / total) * 100);
      const selected = answers[q.id] || null;

      function choose(v) {
        const next = { ...answers, [q.id]: v };
        setAnswers(next);
        if (step < total - 1) {
          setDir('forward');
          setTimeout(() => setStep(s => s + 1), 120);
        }
      }

      function goBack() {
        if (step === 0) return;
        setDir('back');
        setTimeout(() => setStep(s => s - 1), 80);
      }

      async function handleFinish() {
        setSaving(true);
        try {
          const data = await api.post('/profile', { userId: user.id, answers });
          onDone(data);
        } finally { setSaving(false); }
      }

      const isLast = step === total - 1;
      const allAnswered = QUESTIONS.every(q => answers[q.id]);

      return (
        <div className="quiz-wrap fade-in">
          {/* Progresso */}
          <div className="quiz-progress mb-4">
            <div className="d-flex justify-content-between align-items-center mb-2">
              <span className="text-muted" style={{ fontSize: '0.82rem' }}>
                Pergunta {step + 1} de {total}
              </span>
              <span className="fw-semibold" style={{ color: 'var(--color-accent)', fontSize: '0.82rem' }}>
                {progress}%
              </span>
            </div>
            <div className="quiz-bar-track">
              <div className="quiz-bar-fill" style={{ width: `${progress}%` }} />
            </div>
            <div className="quiz-dots">
              {QUESTIONS.map((_, i) => (
                <div key={i} className={`quiz-dot ${i < step ? 'done' : i === step ? 'current' : ''}`} />
              ))}
            </div>
          </div>

          {/* Pergunta */}
          <div className="quiz-card">
            <div className="quiz-q-icon">
              <i className={`bi ${q.icon}`}></i>
            </div>
            <h3 className="quiz-question">{q.label}</h3>

            <div className="d-flex flex-column gap-2 mt-4">
              {q.options.map(opt => (
                <button key={opt.v}
                  className={`quiz-option ${selected === opt.v ? 'selected' : ''}`}
                  onClick={() => choose(opt.v)}>
                  <span className="quiz-option-check">
                    {selected === opt.v
                      ? <i className="bi bi-check-circle-fill"></i>
                      : <i className="bi bi-circle"></i>}
                  </span>
                  {opt.l}
                </button>
              ))}
            </div>

            <div className="d-flex justify-content-between align-items-center mt-4">
              <button className="btn btn-outline-secondary btn-sm" onClick={goBack} disabled={step === 0}>
                <i className="bi bi-chevron-left me-1"></i>Anterior
              </button>

              {isLast ? (
                <button className="btn btn-primary-custom px-4"
                  disabled={saving || !allAnswered} onClick={handleFinish}>
                  {saving
                    ? <span className="spinner-border spinner-border-sm"></span>
                    : <><i className="bi bi-check-circle me-2"></i>Ver meu perfil</>}
                </button>
              ) : (
                <button className="btn btn-primary-custom btn-sm"
                  disabled={!selected} onClick={() => { setDir('forward'); setStep(s => s + 1); }}>
                  Próxima<i className="bi bi-chevron-right ms-1"></i>
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function InvestorProfile() {
      const [saved,    setSaved]    = useState(null);
      const [loading,  setLoading]  = useState(true);
      const [showForm, setShowForm] = useState(false);

      useEffect(() => {
        api.get(`/profile?userId=${user.id}`)
          .then(data => { setSaved(data); setShowForm(false); })
          .catch(() => setShowForm(true))
          .finally(() => setLoading(false));
      }, []);

      function handleDone(data) {
        setSaved(data);
        setShowForm(false);
      }

      function handleRedo() {
        setSaved(null);
        setShowForm(true);
      }

      if (loading) return (
        <div className="app-layout">
          <Sidebar active="profile.html" />
          <main className="main-content d-flex align-items-center justify-content-center">
            <div className="spinner-border" style={{ color: 'var(--color-accent)' }}></div>
          </main>
        </div>
      );

      return (
        <div className="app-layout">
          <Sidebar active="profile.html" />
          <main className="main-content">
            <div className="page-header">
              <h1 className="page-title">Perfil de Investidor</h1>
              <p className="page-subtitle">
                {showForm ? 'Responda as perguntas para descobrir seu perfil' : 'Seu relatório personalizado de investimentos'}
              </p>
            </div>

            {showForm
              ? <Questionnaire onDone={handleDone} />
              : <ProfileResult saved={saved} onRedo={handleRedo} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<InvestorProfile />);
  </script>
</body>
</html>
