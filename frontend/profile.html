        ],
        products: [
          { icon: 'bi-bank', name: 'Tesouro Selic', desc: 'Liquidez diária, segurança máxima', tag: 'Essencial',
            detail: 'Imagine que o governo precisa de dinheiro emprestado para pagar suas contas. Ele te pede esse empréstimo e, em troca, te devolve o valor com juros — exatamente o que a Selic (a taxa de juros oficial do Brasil) estiver pagando naquele momento. Isso é o Tesouro Selic.\n\nÉ considerado o investimento mais seguro do Brasil porque quem garante o pagamento é o próprio governo federal. Praticamente não existe risco de calote. E o melhor: você pode pedir o dinheiro de volta a qualquer dia útil, sem perder nada do que rendeu. É o lugar ideal para guardar sua reserva de emergência — aquele dinheiro que você pode precisar de repente.',

          { icon: 'bi-building', name: 'CDB / LCI / LCA', desc: 'Proteção FGC, rendimento acima da poupança', tag: 'Recomendado',

            detail: 'Você já percebeu que R$ 100 hoje compram menos coisas do que compravam há 5 anos? Isso é inflação — o dinheiro perdendo valor com o tempo. O Tesouro IPCA+ existe justamente para impedir que isso aconteça com o seu patrimônio.\n\nEle paga sempre a inflação oficial (IPCA) mais uma taxa extra. Então, se a inflação for 5% no ano e o título pagar "IPCA + 6,5%", você rendeu 11,5% no total — garantindo que seu dinheiro cresceu de verdade, acima da inflação. É ideal para objetivos de longo prazo como aposentadoria ou compra de imóvel. O único detalhe: se você precisar sacar antes do prazo combinado, o valor pode variar um pouco para cima ou para baixo.',

          { icon: 'bi-shield', name: 'Tesouro IPCA+', desc: 'Base sólida que bate a inflação sempre', tag: 'Essencial',
            detail: 'Imagine que você guarda R$ 10.000 embaixo do colchão. Dez anos depois, você ainda tem R$ 10.000 — mas esse dinheiro compra muito menos coisas porque os preços subiram. O Tesouro IPCA+ existe para evitar exatamente isso: ele garante que o seu dinheiro vai sempre render acima da inflação, preservando o seu poder de compra.\n\nEle funciona assim: paga a inflação do período mais uma taxa extra (por exemplo, "IPCA + 6% ao ano"). Metade da carteira Moderada fica aqui, funcionando como uma âncora segura enquanto o restante busca retornos maiores em outros ativos. É ideal para objetivos como aposentadoria ou comprar um imóvel.',

          { icon: 'bi-buildings', name: 'FIIs (Fundos Imobiliários)', desc: 'Invista em imóveis sem precisar comprar um', tag: 'Recomendado',
            detail: 'Você já pensou em ser dono de um shopping, de um galpão logístico ou de um edifício de escritórios? Com os FIIs (Fundos de Investimento Imobiliário) você pode — de forma indireta e com muito menos dinheiro do que seria necessário para comprar um imóvel de verdade.\n\nCada fundo reúne o dinheiro de muitos investidores para comprar ou financiar imóveis. O aluguel e os rendimentos são divididos entre todos os participantes todo mês, direto na sua conta de corretora. E para pessoa física, esses rendimentos são isentos de Imposto de Renda. As cotas são compradas e vendidas na bolsa como se fossem ações — você entra e sai quando quiser.',

            detail: 'Quando você compra uma cota do BOVA11, está comprando um pedacinho de todas as maiores empresas do Brasil ao mesmo tempo — Petrobras, Vale, Itaú, Magazine Luiza e muitas outras. Se uma empresa vai mal, as outras equilibram. Isso se chama diversificação e é uma das proteções mais importantes de qualquer carteira.\n\nO BOVA11 replica o Ibovespa, o principal índice da bolsa brasileira. Ao invés de você ter que estudar cada empresa individualmente, o ETF faz isso automaticamente. A taxa de administração é baixíssima (em torno de 0,1% ao ano) e uma cota custa em média R$ 100 — acessível para qualquer investidor.',

          { icon: 'bi-globe', name: 'ETFs Internacionais', desc: 'Proteja seu dinheiro contra crises locais', tag: 'Complementar',

            detail: 'A tentação de quem começa na bolsa é escolher ações de empresas específicas. Mas sem experiência, é muito fácil escolher mal e perder dinheiro. Os ETFs eliminam esse problema: ao comprar BOVA11, você automaticamente investe nas maiores empresas do Brasil sem precisar analisar nenhuma delas.\n\nComeçar com ETFs te dá exposição real ao mercado de ações, você começa a entender como os preços oscilam e ganha confiança — sem o risco de apostar em uma empresa que vai mal. Depois de alguns meses acompanhando, você estará muito mais preparado para eventualmente selecionar ações individualmente se quiser.' },
          { label: 'Pesquise FIIs com histórico sólido', desc: 'Escolha FIIs que pagam rendimentos consistentes há pelo menos 2 anos',
            detail: 'Nem todo fundo imobiliário é confiável. Alguns são recentes e ainda não têm histórico para avaliar; outros tiveram rendimentos altos por um período mas não conseguem manter. Antes de investir, você precisa verificar se aquele fundo realmente entrega o que promete ao longo do tempo.\n\nO ideal é pesquisar o histórico de distribuições mensais dos últimos 2 a 3 anos: o rendimento foi consistente ou variou muito? Os imóveis do fundo ficaram alugados a maior parte do tempo? O gestor se comunica bem com os investidores, publicando relatórios mensais claros? Sites como FundsExplorer e StatusInvest reunem essas informações gratuitamente para você comparar.' },

            detail: 'Muitas pessoas ficam esperando o "momento certo" para investir: "vou esperar a bolsa cair" ou "vou comprar quando o dólar baixar". O problema é que ninguém sabe quando isso vai acontecer — nem os maiores especialistas do mundo acertam isso de forma consistente.\n\nA estratégia mais eficaz para investidores comuns se chama Dollar-Cost Averaging: você define um valor fixo (por exemplo, R$ 300 por mês) e investe todo mês, independente do que o mercado estiver fazendo. Quando os preços estão baixos, o mesmo dinheiro compra mais cotas. Quando estão altos, compra menos. No longo prazo, isso reduz o custo médio e produz resultados melhores do que qualquer tentativa de acertar o momento ideal.' },

            method: 'Antes de comprar qualquer ação, verifique estes quatro indicadores básicos no StatusInvest ou Fundamentus. P/L (Preço sobre Lucro): compara o preço da ação com o lucro da empresa — quanto menor em relação ao setor, mais barata a ação está. ROE (Retorno sobre Patrimônio): acima de 15% indica que a empresa usa bem o dinheiro dos sócios. Dívida Líquida/EBITDA: abaixo de 2 vezes indica que a empresa não está afogada em dívidas. Margem Líquida: quanto a empresa lucra de cada real que vende. Compare sempre com outras empresas do mesmo setor, porque cada setor tem padrões diferentes.' },
          { icon: 'bi-globe2', name: 'ETFs Globais', desc: 'Invista nas maiores empresas do mundo pela bolsa brasileira', tag: 'Recomendado',
            detail: 'Apple, Microsoft, Google, Amazon, Meta — essas são algumas das empresas mais lucrativas do mundo. Com ETFs globais como o IVVB11, você investe nelas diretamente pela bolsa brasileira, sem precisar abrir conta no exterior, em dólar ou entender nada de mercado americano.\n\nAlém de acessar empresas extraordinárias que não existem na bolsa brasileira, você se protege da desvalorização do real: se o dólar sobe, o valor do seu investimento em reais sobe junto. Para o perfil Arrojado, 20% da carteira em ETFs internacionais reduz o risco de concentração no Brasil e abre portas para o crescimento da economia global.',
            method: 'Pesquise na sua corretora por ETFs internacionais disponíveis na B3. O IVVB11 replica o S&P 500 (as 500 maiores empresas dos EUA). Verifique o Tracking Error: quanto menor, mais fiel o ETF é ao índice original — abaixo de 1% ao ano é bom. Veja o volume médio diário de negociação: ETFs com volume baixo têm spread alto (diferença entre preço de compra e venda), o que aumenta o custo. Para BDRs (certificados de empresas estrangeiras negociados no Brasil), os critérios de análise são os mesmos que para ações brasileiras.' },
          { icon: 'bi-buildings', name: 'FIIs', desc: 'Renda mensal que equilibra a volatilidade da carteira', tag: 'Recomendado',
            detail: 'Mesmo sendo um investidor arrojado, ter 15% da carteira em FIIs faz sentido por um motivo prático: enquanto as ações podem não pagar nada por meses e oscilarem bastante, os FIIs jogam dinheiro na sua conta todo mês. Esse rendimento mensal pode ser reinvestido, aumentando sua posição sem gastar do próprio salário.\n\nOs FIIs também tendem a oscilar menos do que ações individuais, o que suaviza a volatilidade geral da sua carteira nos momentos difíceis do mercado. É um equilíbrio inteligente: você mantém o potencial de crescimento das ações enquanto colhe renda previsível dos imóveis.',
            method: 'Para o perfil Arrojado, dê preferência a FIIs mais agressivos: FIIs de desenvolvimento (que compram terrenos, constroem e vendem) e FIIs de papel com CRIs de alta rentabilidade. Verifique o Dividend Yield descontando eventos não-recorrentes como venda de imóveis — esses eventos inflam o rendimento pontualmente mas não se repetem. Analise o P/VP: abaixo de 0,95 pode significar que as cotas estão baratas em relação ao valor real dos imóveis. Acompanhe os relatórios mensais do gestor para entender para onde o fundo está crescendo.' },
          { icon: 'bi-currency-bitcoin', name: 'Criptoativos', desc: 'Alto risco, alto potencial — mantenha pequeno', tag: 'Opcional',
            detail: 'Bitcoin, Ethereum e outros criptoativos são ativos digitais que funcionam sem nenhum banco ou governo controlando. Eles podem subir 100% em um ano — ou cair 70% em alguns meses. Essa volatilidade extrema é tanto o apelo quanto o maior perigo.\n\nPara o perfil Arrojado, uma exposição de até 5% do patrimônio faz sentido como uma aposta de alto potencial. Se valorizar muito, melhora o resultado geral da carteira sem você ter precisado sacrificar o restante. Se desvalorizar, o impacto é limitado. A regra de ouro: nunca invista em cripto um valor que, se fosse a zero, comprometeria seus objetivos de vida.',
            method: 'Comece pelos ativos mais consolidados: Bitcoin (BTC) e Ethereum (ETH) existem há mais de 10 anos e têm a maior liquidez e credibilidade do mercado. A forma mais segura de investir no Brasil é através de ETFs de cripto na B3 (como BITH11 para Bitcoin), pois são regulamentados pela CVM e você não precisa gerenciar carteiras digitais. Se quiser comprar diretamente em exchanges, use apenas plataformas regulamentadas. Fuja de projetos sem equipe identificada, sem whitepaper claro ou que prometem retornos garantidos — esses são sinais quase certos de golpe.' },
        ],
        steps: [
          { label: 'Mantenha a reserva de emergência separada', desc: 'Guarde pelo menos 3 meses de gastos em renda fixa líquida, fora da carteira de investimentos',
            detail: 'Mesmo sendo um investidor arrojado, você não pode misturar a reserva de emergência com a carteira de investimentos. São dois propósitos completamente diferentes: um é proteção, o outro é crescimento.\n\nImagine que o mercado de ações cai 30% — exatamente quando você perde o emprego e precisa de dinheiro urgente. Se sua reserva estiver em ações, você seria obrigado a vender no pior momento possível, realizando um prejuízo enorme. Mas se a reserva estiver separada em Tesouro Selic, você saca sem problema e deixa as ações "recuperarem" com calma. Para o perfil Arrojado, 3 meses de gastos já são suficientes.' },
          { label: 'Aprenda a analisar empresas antes de comprar ações', desc: 'Entender o básico de análise fundamentalista separa o investidor do especulador',
            detail: 'Análise fundamentalista é o método de entender se uma empresa vale o que está sendo cobrado por ela. É como avaliar um apartamento antes de comprar: você verifica a estrutura, a localização, o histórico e o preço — e decide se vale a pena.\n\nNas ações, os principais "documentos do imóvel" são os relatórios trimestrais de resultado (chamados ITR), disponíveis gratuitamente no site da B3. Neles você vê quanto a empresa faturou, o quanto lucrou, se está endividada e para onde está crescendo. Sites como StatusInvest e Fundamentus resumem essas informações em indicadores fáceis de comparar. Sem esse estudo, você não está investindo — está apostando.' },
          { label: 'Invista um valor fixo todo mês, sem exceção', desc: 'Aportes mensais regulares superam qualquer tentativa de acertar o melhor momento do mercado',
            detail: 'A tentação do investidor arrojado é tentar acertar o timing: "vou esperar a bolsa cair mais para comprar" ou "vou vender agora que está alto". O problema é que nenhum profissional do mercado consegue fazer isso de forma consistente — e você provavelmente também não vai conseguir.\n\nA estratégia mais eficaz se chama Dollar-Cost Averaging: investir um valor fixo todo mês, independente do mercado. Quando as ações caem, o mesmo dinheiro compra mais cotas. Quando sobem, compra menos. No longo prazo, isso resulta em um custo médio menor e retornos melhores do que qualquer estratégia de timing. Automatize seus aportes para que a decisão nem precise ser tomada conscientemente todo mês.' },
          { label: 'Distribua entre setores e países diferentes', desc: 'Não concentre toda a carteira em um setor ou país — diversificação é proteção',
            detail: 'Imagina que você colocou 80% da sua carteira em ações de bancos. Aí vem uma crise financeira, os bancos despencam 50%, e sua carteira vai junto. Isso é o que acontece quando há concentração excessiva em um setor.\n\nA diversificação não elimina todos os riscos — em crises globais graves, praticamente tudo cai junto. Mas ela reduz o risco específico de um setor ou empresa: se os bancos vão mal mas a tecnologia vai bem, sua carteira equilibra. Distribua entre setores diferentes (tecnologia, energia, saúde, consumo, financeiro) e entre países diferentes (Brasil + EUA + global). Quanto mais distribuído, menos você depende de uma única aposta dar certo.' },
        ],
      },
    };

    function DetailModal({ item, color, onClose }) {
      if (!item) return null;
      const paragraphs = item.detail ? item.detail.split('\n\n') : [];
      return (
        <div className="detail-modal-backdrop" onClick={onClose}>
          <div className="detail-modal-box fade-in" onClick={e => e.stopPropagation()}>
            <div className="detail-modal-header" style={{ background: color }}>
              {item.icon && <i className={`bi ${item.icon} detail-modal-hicon`}></i>}
              <div className="flex-grow-1">
                <div className="detail-modal-title">{item.name || item.label}</div>
                {item.desc && <div className="detail-modal-sub">{item.desc}</div>}
              </div>
              <button className="detail-modal-close" onClick={onClose}>
                <i className="bi bi-x-lg"></i>
              </button>
            </div>
            <div className="detail-modal-body">
              {paragraphs.map((p, i) => <p key={i}>{p}</p>)}

              {item.method && (
                <div className="detail-method-section">
                  <div className="detail-method-title" style={{ color }}>
                    <i className="bi bi-search me-2"></i>
                    Como identificar um bom produto
                  </div>
                  <p>{item.method}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function AllocationChecklist({ allocation, riskProfile }) {
      const storageKey = `pragfy_alloc_${user.id}_${riskProfile}`;
      const [checked, setChecked] = useState(() => {
        try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); }
        catch { return {}; }
      });

      function toggle(label) {
        setChecked(prev => {
          const next = { ...prev, [label]: !prev[label] };
          localStorage.setItem(storageKey, JSON.stringify(next));
          return next;
        });
      }

      const done = allocation.filter(a => checked[a.label]).length;

      return (
        <div>
          <div className="alloc-bar mb-3">
            {allocation.map(a => (
              <div key={a.label} style={{ width: `${a.pct}%`, background: a.color, opacity: checked[a.label] ? 1 : 0.35, transition: 'opacity 0.3s' }}
                title={`${a.label}: ${a.pct}%`} />
            ))}
          </div>

          <div className="d-flex flex-column gap-2">
            {allocation.map(a => (
              <label key={a.label} className={`alloc-check-row ${checked[a.label] ? 'alloc-check-row--done' : ''}`}
                onClick={() => toggle(a.label)}>
                <span className="alloc-dot" style={{ background: a.color }} />
                <span className="alloc-label">{a.label}</span>
                <span className="alloc-pct">{a.pct}%</span>
                <span className={`alloc-checkbox ${checked[a.label] ? 'alloc-checkbox--checked' : ''}`}
                  style={{ '--chk-color': a.color }}>
                  {checked[a.label] && <i className="bi bi-check-lg"></i>}
                </span>
              </label>
            ))}
          </div>

          <div className="alloc-progress-label">
            {done} de {allocation.length} alocações concluídas
          </div>
        </div>
      );
    }

    function ProfileResult({ saved, onRedo }) {
      const [selected, setSelected] = useState(null);
      const data = PROFILE_DATA[saved.riskProfile];
      if (!data) return null;

      const tagColors = { Essencial: '#1d9e63', Recomendado: '#0426b0', Complementar: '#d97706', Opcional: '#8b5cf6' };

      return (
        <div className="fade-in">
          {selected && (
            <DetailModal item={selected} color={data.color} onClose={() => setSelected(null)} />
          )}

          {/* Hero card */}
          <div className={`profile-hero profile-hero--${data.cls} mb-4`}>
            <div className="d-flex align-items-center gap-3 mb-3">
              <div className="profile-hero-icon">
                <i className={`bi ${data.icon}`}></i>
              </div>
              <div>
                <div className="profile-hero-label">Seu perfil de investidor</div>
                <div className="profile-hero-name">{saved.riskProfile.charAt(0) + saved.riskProfile.slice(1).toLowerCase()}</div>
                <div className="profile-hero-tagline">{data.tagline}</div>
              </div>
            </div>
            <p className="profile-hero-desc">{data.desc}</p>
            <button className="btn btn-sm btn-outline-light mt-1" onClick={onRedo}>
              <i className="bi bi-arrow-repeat me-1"></i>Refazer questionário
            </button>
          </div>

          <div className="row g-4">
            {/* Alocação sugerida */}
            <div className="col-lg-6">
              <div className="card-section h-100">
                <h2 className="section-title">
                  <i className="bi bi-pie-chart me-2" style={{ color: data.color }}></i>
                  Alocação sugerida
                </h2>
                <AllocationChecklist allocation={data.allocation} riskProfile={saved.riskProfile} />
              </div>
            </div>

            {/* Produtos recomendados */}
            <div className="col-lg-6">
              <div className="card-section h-100">
                <h2 className="section-title">
                  <i className="bi bi-star me-2" style={{ color: data.color }}></i>
                  Produtos recomendados
                  <span className="ms-2" style={{ fontSize: '0.72rem', fontWeight: 400, color: 'var(--text-muted)' }}>
                    clique para saber mais
                  </span>
                </h2>
                <div className="d-flex flex-column gap-2">
                  {data.products.map(p => (
                    <div key={p.name} className="product-row product-row--clickable" onClick={() => setSelected(p)}>
                      <div className="product-icon" style={{ background: data.color + '22', color: data.color }}>
                        <i className={`bi ${p.icon}`}></i>
                      </div>
                      <div className="flex-grow-1 overflow-hidden">
                        <div className="d-flex align-items-center gap-2">
                          <span className="product-name">{p.name}</span>
                          <span className="product-tag" style={{ background: tagColors[p.tag] + '22', color: tagColors[p.tag] }}>
                            {p.tag}
                          </span>
                        </div>
                        <div className="product-desc">{p.desc}</div>
                      </div>
                      <i className="bi bi-chevron-right product-chevron"></i>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Primeiros passos */}
            <div className="col-12">
              <div className="card-section">
                <h2 className="section-title">
                  <i className="bi bi-list-check me-2" style={{ color: data.color }}></i>
                  Primeiros passos
                  <span className="ms-2" style={{ fontSize: '0.72rem', fontWeight: 400, color: 'var(--text-muted)' }}>
                    clique para saber mais
                  </span>
                </h2>
                <div className="d-flex flex-column gap-2">
                  {data.steps.map((step, i) => (
                    <div key={i} className="step-row step-row--clickable" onClick={() => setSelected(step)}>
                      <div className="step-num" style={{ background: data.color }}>{i + 1}</div>
                      <p className="step-text">{step.desc}</p>
                      <i className="bi bi-chevron-right product-chevron ms-2"></i>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Questionnaire({ onDone }) {
      const [step,    setStep]    = useState(0);
      const [answers, setAnswers] = useState({});
      const [saving,  setSaving]  = useState(false);
      const [dir,     setDir]     = useState('forward');

      const q = QUESTIONS[step];
      const total = QUESTIONS.length;
      const progress = Math.round(((step) / total) * 100);
      const selected = answers[q.id] || null;

      function choose(v) {
        const next = { ...answers, [q.id]: v };
        setAnswers(next);
        if (step < total - 1) {
          setDir('forward');
          setTimeout(() => setStep(s => s + 1), 120);
        }
      }

      function goBack() {
        if (step === 0) return;
        setDir('back');
        setTimeout(() => setStep(s => s - 1), 80);
      }

      async function handleFinish() {
        setSaving(true);
        try {
          const data = await api.post('/profile', { userId: user.id, answers });
          onDone(data);
        } finally { setSaving(false); }
      }

      const isLast = step === total - 1;
      const allAnswered = QUESTIONS.every(q => answers[q.id]);

      return (
        <div className="quiz-wrap fade-in">
          {/* Progresso */}
          <div className="quiz-progress mb-4">
            <div className="d-flex justify-content-between align-items-center mb-2">
              <span className="text-muted" style={{ fontSize: '0.82rem' }}>
                Pergunta {step + 1} de {total}
              </span>
              <span className="fw-semibold" style={{ color: 'var(--color-accent)', fontSize: '0.82rem' }}>
                {progress}%
              </span>
            </div>
            <div className="quiz-bar-track">
              <div className="quiz-bar-fill" style={{ width: `${progress}%` }} />
            </div>
            <div className="quiz-dots">
              {QUESTIONS.map((_, i) => (
                <div key={i} className={`quiz-dot ${i < step ? 'done' : i === step ? 'current' : ''}`} />
              ))}
            </div>
          </div>

          {/* Pergunta */}
          <div className="quiz-card">
            <div className="quiz-q-icon">
              <i className={`bi ${q.icon}`}></i>
            </div>
            <h3 className="quiz-question">{q.label}</h3>

            <div className="d-flex flex-column gap-2 mt-4">
              {q.options.map(opt => (
                <button key={opt.v}
                  className={`quiz-option ${selected === opt.v ? 'selected' : ''}`}
                  onClick={() => choose(opt.v)}>
                  <span className="quiz-option-check">
                    {selected === opt.v
                      ? <i className="bi bi-check-circle-fill"></i>
                      : <i className="bi bi-circle"></i>}
                  </span>
                  {opt.l}
                </button>
              ))}
            </div>

            <div className="d-flex justify-content-between align-items-center mt-4">
              <button className="btn btn-outline-secondary btn-sm" onClick={goBack} disabled={step === 0}>
                <i className="bi bi-chevron-left me-1"></i>Anterior
              </button>

              {isLast ? (
                <button className="btn btn-primary-custom px-4"
                  disabled={saving || !allAnswered} onClick={handleFinish}>
                  {saving
                    ? <span className="spinner-border spinner-border-sm"></span>
                    : <><i className="bi bi-check-circle me-2"></i>Ver meu perfil</>}
                </button>
              ) : (
                <button className="btn btn-primary-custom btn-sm"
                  disabled={!selected} onClick={() => { setDir('forward'); setStep(s => s + 1); }}>
                  Próxima<i className="bi bi-chevron-right ms-1"></i>
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function InvestorProfile() {
      const [saved,    setSaved]    = useState(null);
      const [loading,  setLoading]  = useState(true);
      const [showForm, setShowForm] = useState(false);

      useEffect(() => {
        api.get(`/profile?userId=${user.id}`)
          .then(data => { setSaved(data); setShowForm(false); })
          .catch(() => setShowForm(true))
          .finally(() => setLoading(false));
      }, []);

      function handleDone(data) {
        setSaved(data);
        setShowForm(false);
      }

      function handleRedo() {
        setSaved(null);
        setShowForm(true);
      }

      if (loading) return (
        <div className="app-layout">
          <Sidebar active="profile.html" />
          <main className="main-content d-flex align-items-center justify-content-center">
            <div className="spinner-border" style={{ color: 'var(--color-accent)' }}></div>
          </main>
        </div>
      );

      return (
        <div className="app-layout">
          <Sidebar active="profile.html" />
          <main className="main-content">
            <div className="page-header">
              <h1 className="page-title">Perfil de Investidor</h1>
              <p className="page-subtitle">
                {showForm ? 'Responda as perguntas para descobrir seu perfil' : 'Seu relatório personalizado de investimentos'}
              </p>
            </div>

            {showForm
              ? <Questionnaire onDone={handleDone} />
              : <ProfileResult saved={saved} onRedo={handleRedo} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<InvestorProfile />);
  </script>
</body>
</html>
