<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PragFY - Perfil de Investidor</title>
  <link rel="icon" href="assets/PragFY_Logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="services/theme.js"></script>
</head>
<body>
  <script src="services/storage.js"></script>
  <script>if (!storage.getUser()) window.location.replace('index.html');</script>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="services/api.js"></script>
  <script src="components/sidebar.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const user = storage.getUser();

    const QUESTIONS = [
      { id: 'renda_mensal',    label: 'Qual é a sua renda mensal aproximada?',
        options: [{ v:'ate_2k', l:'Até R$ 2.000'}, {v:'2k_5k', l:'R$ 2.001 a R$ 5.000'},
                  { v:'5k_10k', l:'R$ 5.001 a R$ 10.000'}, {v:'acima_10k', l:'Acima de R$ 10.000'}] },
      { id: 'gasto_mensal',    label: 'Qual percentual da sua renda você gasta mensalmente?',
        options: [{v:'ate_50', l:'Até 50%'}, {v:'50_80', l:'Entre 50% e 80%'},
                  {v:'80_100', l:'Entre 80% e 100%'}, {v:'acima', l:'Mais do que ganha (endividado)'}] },
      { id: 'dividas',         label: 'Você possui dívidas atualmente?',
        options: [{v:'nao', l:'Não'}, {v:'sim_controle', l:'Sim, mas sob controle'},
                  {v:'sim_pesadas', l:'Sim, e pesando no orçamento'}] },
      { id: 'objetivo',        label: 'Qual é o seu principal objetivo financeiro?',
        options: [{v:'emergencia', l:'Reserva de emergência'}, {v:'aposentadoria', l:'Aposentadoria / independência financeira'},
                  {v:'compra_bem', l:'Comprar um bem (imóvel, carro)'}, {v:'renda_extra', l:'Gerar renda passiva'}] },
      { id: 'horizonte',       label: 'Em quanto tempo deseja atingir seu objetivo?',
        options: [{v:'curto', l:'Curto prazo (até 2 anos)'}, {v:'medio', l:'Médio prazo (2 a 5 anos)'},
                  {v:'longo', l:'Longo prazo (mais de 5 anos)'}] },
      { id: 'ja_investe',      label: 'Você já investe atualmente?',
        options: [{v:'nao', l:'Não, nunca investi'}, {v:'sim_basico', l:'Sim, apenas poupança'},
                  {v:'sim_diversificado', l:'Sim, tenho investimentos diversificados'}] },
      { id: 'reacao_perdas',   label: 'Se seu investimento perdesse 20% em 1 mês, você:',
        options: [{v:'venderia', l:'Venderia tudo para evitar mais perdas'},
                  {v:'preocupado', l:'Esperaria recuperar, mas ficaria preocupado'},
                  {v:'tranquilo', l:'Aproveitaria para investir mais'}] },
      { id: 'poupanca_mensal', label: 'Quanto do seu salário consegue poupar mensalmente?',
        options: [{v:'nada', l:'Nada por enquanto'}, {v:'ate_10', l:'Menos de 10%'},
                  {v:'10_30', l:'Entre 10% e 30%'}, {v:'acima_30', l:'Mais de 30%'}] },
    ];

    const RISK_INFO = {
      CONSERVADOR: { cls: 'conservador', icon: 'bi-shield-check',
        desc: 'Você prefere segurança e previsibilidade. Indicado: Tesouro Direto, CDB, LCI/LCA.' },
      MODERADO:    { cls: 'moderado',    icon: 'bi-graph-up',
        desc: 'Equilíbrio entre segurança e crescimento. Indicado: Fundos mistos, Tesouro IPCA, FIIs.' },
      ARROJADO:    { cls: 'arrojado',    icon: 'bi-graph-up-arrow',
        desc: 'Você aceita riscos por maiores retornos. Indicado: Ações, ETFs, FIIs, Criptoativos.' },
    };

    function InvestorProfile() {
      const [answers,   setAnswers]   = useState({});
      const [saved,     setSaved]     = useState(null);
      const [loading,   setLoading]   = useState(true);
      const [saving,    setSaving]    = useState(false);
      const [showForm,  setShowForm]  = useState(false);

      useEffect(() => {
        api.get(`/profile?userId=${user.id}`)
          .then(data => { setSaved(data); setShowForm(false); })
          .catch(() => { setShowForm(true); })
          .finally(() => setLoading(false));
      }, []);

      async function handleSubmit(e) {
        e.preventDefault();
        setSaving(true);
        try {
          const data = await api.post('/profile', { userId: user.id, answers });
          setSaved(data);
          setShowForm(false);
        } finally { setSaving(false); }
      }

      const answered = QUESTIONS.filter(q => answers[q.id]).length;
      const progress  = Math.round((answered / QUESTIONS.length) * 100);

      if (loading) return (
        <div className="app-layout">
          <Sidebar active="profile.html" />
          <main className="main-content d-flex align-items-center justify-content-center">
            <div className="spinner-border" style={{ color: 'var(--color-accent)' }}></div>
          </main>
        </div>
      );

      return (
        <div className="app-layout">
          <Sidebar active="profile.html" />

          <main className="main-content fade-in">
            <div className="page-header">
              <h1 className="page-title">Perfil de Investidor</h1>
              <p className="page-subtitle">Descubra seu perfil e receba orientações personalizadas</p>
            </div>

            {/* Resultado salvo */}
            {saved && !showForm && (() => {
              const info = RISK_INFO[saved.riskProfile];
              return info ? (
                <div className="card-section mb-4">
                  <h2 className="section-title">Seu perfil atual</h2>
                  <div className="d-flex flex-column gap-3">
                    <div className={`risk-badge ${info.cls}`}>
                      <i className={`bi ${info.icon} fs-5`}></i>
                      {saved.riskProfile.charAt(0) + saved.riskProfile.slice(1).toLowerCase()}
                    </div>
                    <p className="mb-0 text-muted">{info.desc}</p>
                    <button className="btn btn-outline-secondary align-self-start"
                      onClick={() => { setAnswers({}); setShowForm(true); }}>
                      <i className="bi bi-arrow-repeat me-1"></i>Refazer questionário
                    </button>
                  </div>
                </div>
              ) : null;
            })()}

            {/* Formulário */}
            {showForm && (
              <div className="question-card">
                <div className="mb-4">
                  <div className="d-flex justify-content-between align-items-center mb-1">
                    <small className="text-muted">{answered} de {QUESTIONS.length} perguntas respondidas</small>
                    <small className="fw-semibold" style={{ color: 'var(--color-accent)' }}>{progress}%</small>
                  </div>
                  <div className="progress" style={{ height: 6, borderRadius: 10 }}>
                    <div className="progress-bar" role="progressbar"
                      style={{ width: `${progress}%`, background: 'var(--color-accent)', borderRadius: 10 }}></div>
                  </div>
                </div>

                <form onSubmit={handleSubmit}>
                  {QUESTIONS.map((q, i) => (
                    <div key={q.id} className="question-step">
                      <div className="step-number">{i + 1}</div>
                      <div className="flex-grow-1">
                        <label className="form-label fw-semibold mb-2">{q.label}</label>
                        <select className="form-select" required
                          value={answers[q.id] || ''}
                          onChange={e => setAnswers(prev => ({ ...prev, [q.id]: e.target.value }))}>
                          <option value="">Selecione...</option>
                          {q.options.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                        </select>
                      </div>
                    </div>
                  ))}

                  <div className="d-flex justify-content-end mt-3">
                    <button type="submit" className="btn btn-primary-custom px-4"
                      disabled={saving || answered < QUESTIONS.length}>
                      {saving
                        ? <span className="spinner-border spinner-border-sm"></span>
                        : <><i className="bi bi-check-circle me-2"></i>Descobrir meu perfil</>}
                    </button>
                  </div>
                  {answered < QUESTIONS.length && (
                    <p className="text-muted small text-end mt-2">
                      Responda todas as {QUESTIONS.length} perguntas para continuar
                    </p>
                  )}
                </form>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<InvestorProfile />);
  </script>
</body>
</html>
