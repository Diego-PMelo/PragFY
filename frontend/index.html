<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PragFY - Login</title>
  <link rel="icon" href="assets/PragFY_Logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="services/theme.js"></script>
</head>
<body>
  <!-- Redireciona para dashboard se já estiver logado -->
  <script src="services/storage.js"></script>
  <script>if (storage.getUser()) window.location.replace('dashboard.html');</script>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="services/api.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function Login() {
      const [email,       setEmail]       = useState('');
      const [password,    setPassword]    = useState('');
      const [showPass,    setShowPass]    = useState(false);
      const [error,       setError]       = useState('');
      const [loading,     setLoading]     = useState(false);
      const [theme,       setTheme]       = useState(localStorage.getItem('pragfy_theme') || 'dark');

      function toggleTheme() {
        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        localStorage.setItem('pragfy_theme', next);
        document.documentElement.setAttribute('data-bs-theme', next);
        if (next === 'light') document.documentElement.classList.add('light-mode');
        else document.documentElement.classList.remove('light-mode');
      }

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const user = await api.post('/auth/login', { email, password });
          storage.setUser(user);
          window.location.href = 'dashboard.html';
        } catch (err) {
          setError(err.message || 'Email ou senha inválidos');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="auth-page">
          <img src="assets/LogoBg.png" className="gear-bg" alt="" />
          <button className="btn-theme-float" onClick={toggleTheme} aria-label="Alternar tema">
            <i className={theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill'}></i>
          </button>

          <div className="auth-card fade-in">
            <div className="auth-logo">
              <img src="assets/PragFY_Logo.svg" alt="PragFY" />
              <span>ragFY</span>
            </div>

            <form className="auth-form" onSubmit={handleSubmit}>
              {error && (
                <div className="alert alert-danger py-2 px-3" style={{ borderRadius: 10 }}>
                  <i className="bi bi-exclamation-circle me-2"></i>{error}
                </div>
              )}

              <div className="auth-input-wrap">
                <img src="assets/Mail.png" className="input-icon" alt="" style={{ transform: 'scaleX(-1)' }} />
                <input type="email" placeholder="Email" value={email}
                  onChange={e => setEmail(e.target.value)} required autoComplete="email" />
              </div>

              <div className="auth-input-wrap">
                <img src="assets/Locker.png" className="input-icon" alt="" style={{ transform: 'scaleX(-1)' }} />
                <input type={showPass ? 'text' : 'password'} placeholder="Senha" value={password}
                  onChange={e => setPassword(e.target.value)} required autoComplete="current-password" />
                <button type="button" className="btn-eye" onClick={() => setShowPass(v => !v)}>
                  <img src="assets/Eye.png" alt="" width={22} style={{ transform: 'scaleX(-1)' }} />
                </button>
              </div>

              <button type="submit" className="btn-auth" disabled={loading}>
                {loading ? <span className="spinner-border spinner-border-sm"></span> : 'LOGIN'}
              </button>

              <div className="auth-links">
                <a href="register.html">Crie sua conta</a>
                <a href="#">Esqueceu sua senha?</a>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Login />);
  </script>
</body>
</html>
