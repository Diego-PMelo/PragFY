<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PragFY - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container" id="loginContainer">
        <button class="theme-toggle" id="themeToggle" title="Alternar tema">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <div class="background-elements">
            <div class="gear-background">
                <img src="assets/LogoBg.png" alt="" class="gear-image">
            </div>
            <div class="overlay"></div>
        </div>

        <div class="login-content">
            <div class="logo-section">
                <div class="logo-wrapper">
                    <img src="assets/PragFY_Logo.svg" alt="PragFY Logo" class="logo-image">
                </div>
                <h1 class="logo-text">ragFY</h1>
            </div>

            <form class="login-form" onsubmit="return false;">
                
                <!-- Campo Usuário -->
                <div class="input-group">
                    <div class="input-icon">
                        <img src="assets/Mail.png" alt="">
                    </div>
                    <input type="text" class="form-control login-input" placeholder="Email" required>
                </div>

                <!-- Campo Senha -->
                <div class="input-group password-group">
                    <div class="input-icon">
                        <img src="assets/Locker.png" alt="">
                    </div>
                    <input type="password" class="form-control login-input password-input" placeholder="Password" required>
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <img src="assets/Eye.png" alt="" class="eye-icon">
                    </button>
                </div>

                <!-- Botão Login -->
                <button type="submit" class="btn btn-login">LOGIN</button>

                <!-- Links de Rodapé -->
                <div class="footer-links">
                    <a href="#" class="footer-link">Crie sua conta</a>
                    <a href="#" class="footer-link">Esqueceu sua senha?</a>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
